<!DOCTYPE html>
<html lang="en" class=""><head>

  <meta charset="UTF-8">
  <title>Tichu Scorekeeper</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" type="text/css">
  <body>
    <button id="dark-mode-toggle">🕶️</button>
    <h1>Tichu Scorekeeping</h1>
    <div class="cards">
      <div id="team-tiger" class="team">
        <div class="card-container">
          <img src="https://penumbrabrah.github.io/tichu/tiger-landscape.png"></img>
          <div id="tiger-score" class="score-display"></div>
          <div id="tiger-input-score" class="input-score">50</div>
        </div>
        <div class="button-container">
          <button id="tiger-tichu" class="tab three-way-toggle">Tichu</button>
          <button id="tiger-grand" class="tab three-way-toggle">Grand</button>
          <button id="tiger-sweep" class="tab two-way-toggle">Sweep</button>
        </div>
      </div>
      <div id="team-serpent" class="team">
        <div class="card-container">
          <img src="https://penumbrabrah.github.io/tichu/serpent-landscape.png"></img>
          <div id="serpent-score" class="score-display"></div>
          <div id="serpent-input-score" class="input-score">50</div>
        </div>
        <div class="button-container">
          <button id="serpent-tichu" class="tab three-way-toggle">Tichu</button>
          <button id="serpent-grand" class="tab three-way-toggle">Grand</button>
          <button id="serpent-sweep" class="tab two-way-toggle">Sweep</button>
        </div>
      </div>
    </div>
    <div class="scoring-tiles">
      🐅
      <button class="tile" onclick="addPoints(100)">100</button>
      <button class="tile" onclick="addPoints(50)">50</button>
      <button class="tile" onclick="addPoints(25)">25</button>
      <button class="tile" onclick="addPoints(10)">10</button>
      <button class="tile" onclick="addPoints(5)">5</button>
      <button class="tile" onclick="addPoints(-5)">5</button>
      <button class="tile" onclick="addPoints(-10)">10</button>
      <button class="tile" onclick="addPoints(-25)">25</button>
      <button class="tile" onclick="addPoints(-50)">50</button>
      <button class="tile" onclick="addPoints(-100)">100</button>
      🐍
    </div>
    <button id="submit-round" class="tab">Submit Round</button>
    <div class="history">
      <h2>Round History</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tiger</th>
            <th>Serpent</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="history-body">
        </tbody>
      </table>
      <button id="reset-game" class="tab reset-button">Reset Game</button>
    </div>
    <script type="text/javascript" src="index.js"></script>
  </body>
</html>
